[project]
name = "ar-congress"
version = "0.1.0"
description = "Corpus of Argentine Senate stenographic session transcripts (versiones taquigráficas): acquisition, parsing, analysis"
requires-python = ">=3.13,<3.14"
# Versions pinned to the Jan 2025 environment the parsing heuristics were
# calibrated against (recovered from the old .venv dist-info). pdfplumber's
# char-level extraction output changes across versions — do not bump casually.
dependencies = [
    "pdfplumber==0.11.5",
    "pandas==2.2.3",
    "requests==2.32.3",
    "pyarrow>=25.0.0",
    "matplotlib>=3.11.1",
    "nbformat>=5.10.4",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]
